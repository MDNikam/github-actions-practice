
# Lint: Checks spelling, indentation and syntax

name: Auto Linter

on:
  push:
    paths:
      - '**.py'

  pull_request:
    paths:
      - '**.py'

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linter
        run: pip install ruff

      - name: Run Linter
        run: ruff check .
